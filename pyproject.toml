[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# suppress homeassistant deprecation noise
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["custom_components/brink_flair"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
