# Brink Flair 400 — Lovelace dashboard (English)
#
# Entity IDs assume the device name is "Brink Flair 400" (auto-generated by the integration).
# If your entity IDs differ, update them here or rename entities in HA Settings → Entities.
#
# The fan-speed buttons require the custom:button-card HACS frontend integration.
# If you don't have it, replace the horizontal-stack with a plain select card (see comment below).

title: Brink Flair 400
path: brink_flair
icon: mdi:fan
badges: []
cards:

  # ── Status overview ──────────────────────────────────────────────────────────
  - type: entities
    title: Status
    show_header_toggle: false
    entities:
      - entity: sensor.brink_flair_400_status
        name: Status
      - entity: sensor.brink_flair_400_ventilation_mode
        name: Ventilation mode
      - entity: sensor.brink_flair_400_bypass_status
        name: Bypass status
      - entity: binary_sensor.brink_flair_400_filter_dirty
        name: Filter dirty
      - entity: sensor.brink_flair_400_current_filter_hours
        name: Filter hours used
      - entity: sensor.brink_flair_400_operating_time
        name: Operating time (lifetime)
      - entity: sensor.brink_flair_400_frost_status
        name: Frost status
      - entity: sensor.brink_flair_400_frost_heater_power
        name: Frost heater power
      - entity: sensor.brink_flair_400_frost_fan_reduction
        name: Frost fan reduction
      - entity: sensor.brink_flair_400_supply_pressure
        name: Supply pressure
      - entity: sensor.brink_flair_400_exhaust_pressure
        name: Exhaust pressure

  # ── Air flows & fan speeds ────────────────────────────────────────────────────
  - type: entities
    title: Air Flow
    show_header_toggle: false
    entities:
      - entity: sensor.brink_flair_400_current_intake_air_volume
        name: Current intake air volume
      - entity: sensor.brink_flair_400_setpoint_intake_air_volume
        name: Setpoint intake air volume
      - entity: sensor.brink_flair_400_current_exhaust_air_volume
        name: Current exhaust air volume
      - entity: sensor.brink_flair_400_setpoint_exhaust_air_volume
        name: Setpoint exhaust air volume
      - entity: sensor.brink_flair_400_speed_supply_fan
        name: Speed supply fan
      - entity: sensor.brink_flair_400_speed_exhaust_fan
        name: Speed exhaust fan

  # ── Temperatures & humidity ───────────────────────────────────────────────────
  - type: entities
    title: Climate
    show_header_toggle: false
    entities:
      - entity: sensor.brink_flair_400_temperature_to_inside
        name: Temperature to inside
      - entity: sensor.brink_flair_400_humidity_to_inside
        name: Humidity to inside
      - entity: sensor.brink_flair_400_temperature_to_outside
        name: Temperature to outside
      - entity: sensor.brink_flair_400_humidity_to_outside
        name: Humidity to outside
      - entity: sensor.brink_flair_400_temperature_from_outside
        name: Temperature from outside
      - entity: sensor.brink_flair_400_temperature_ntc2
        name: Temperature NTC2
      - entity: sensor.brink_flair_400_humidity_rht_sensor
        name: Humidity RHT sensor

  # ── Temperature history ───────────────────────────────────────────────────────
  - type: history-graph
    title: Temperature (24 h)
    hours_to_show: 24
    entities:
      - entity: sensor.brink_flair_400_temperature_to_inside
        name: To inside
      - entity: sensor.brink_flair_400_temperature_to_outside
        name: To outside
      - entity: sensor.brink_flair_400_temperature_from_outside
        name: From outside
      - entity: sensor.brink_flair_400_temperature_ntc2
        name: NTC2

  # ── Humidity history ──────────────────────────────────────────────────────────
  - type: history-graph
    title: Humidity (24 h)
    hours_to_show: 24
    entities:
      - entity: sensor.brink_flair_400_humidity_to_inside
        name: To inside
      - entity: sensor.brink_flair_400_humidity_to_outside
        name: To outside
      - entity: sensor.brink_flair_400_humidity_rht_sensor
        name: RHT sensor

  # ── CO2 sensors ──────────────────────────────────────────────────────────────
  - type: entities
    title: CO2
    show_header_toggle: false
    entities:
      - entity: sensor.brink_flair_400_co2_sensor_1
        name: CO2 Sensor 1
      - entity: sensor.brink_flair_400_co2_sensor_2
        name: CO2 Sensor 2
      - entity: sensor.brink_flair_400_co2_sensor_3
        name: CO2 Sensor 3
      - entity: sensor.brink_flair_400_co2_sensor_4
        name: CO2 Sensor 4

  - type: history-graph
    title: CO2 (24 h)
    hours_to_show: 24
    entities:
      - entity: sensor.brink_flair_400_co2_sensor_1
        name: Sensor 1
      - entity: sensor.brink_flair_400_co2_sensor_2
        name: Sensor 2
      - entity: sensor.brink_flair_400_co2_sensor_3
        name: Sensor 3
      - entity: sensor.brink_flair_400_co2_sensor_4
        name: Sensor 4

  # ── Ventilation mode control ──────────────────────────────────────────────────
  # Option A — requires custom:button-card (HACS)
  - type: vertical-stack
    cards:
      - type: markdown
        content: "## Ventilation Mode"
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            icon: mdi:fan-auto
            name: Holiday
            styles:
              card:
                - height: 120px
            show_state: false
            state:
              - operator: template
                value: "[[[ return states['select.brink_flair_400_ventilation_mode'].state === 'holiday' ]]]"
                color: darkcyan
            tap_action:
              action: call-service
              service: select.select_option
              service_data:
                option: holiday
                entity_id: select.brink_flair_400_ventilation_mode
          - type: custom:button-card
            icon: mdi:fan-speed-1
            name: Low
            styles:
              card:
                - height: 120px
            show_state: false
            state:
              - operator: template
                value: "[[[ return states['select.brink_flair_400_ventilation_mode'].state === 'low' ]]]"
                color: darkcyan
            tap_action:
              action: call-service
              service: select.select_option
              service_data:
                option: low
                entity_id: select.brink_flair_400_ventilation_mode
          - type: custom:button-card
            icon: mdi:fan-speed-2
            name: Normal
            styles:
              card:
                - height: 120px
            show_state: false
            state:
              - operator: template
                value: "[[[ return states['select.brink_flair_400_ventilation_mode'].state === 'normal' ]]]"
                color: darkcyan
            tap_action:
              action: call-service
              service: select.select_option
              service_data:
                option: normal
                entity_id: select.brink_flair_400_ventilation_mode
          - type: custom:button-card
            icon: mdi:fan-speed-3
            name: High
            styles:
              card:
                - height: 120px
            show_state: false
            state:
              - operator: template
                value: "[[[ return states['select.brink_flair_400_ventilation_mode'].state === 'high' ]]]"
                color: darkcyan
            tap_action:
              action: call-service
              service: select.select_option
              service_data:
                option: high
                entity_id: select.brink_flair_400_ventilation_mode
          - type: custom:button-card
            icon: mdi:fan-plus
            name: Boost
            styles:
              card:
                - height: 120px
              icon:
                - animation: |
                    [[[
                      return states['script.brink_boost_30min'].state === 'on'
                      ? 'rotating 1s linear infinite'
                      : 'none'
                    ]]]
            show_state: false
            state:
              - operator: template
                value: >-
                  [[[ return states['script.brink_boost_30min'].state === 'on'
                  ]]]
                color: darkcyan
            tap_action:
              action: call-service
              service: script.brink_boost_30min

  # Option B — simple select card (no custom cards needed, uncomment to use instead of Option A)
  # - type: entities
  #   title: Ventilation Mode
  #   entities:
  #     - entity: select.brink_flair_400_ventilation_mode
  #       name: Ventilation mode

  # ── Settings ──────────────────────────────────────────────────────────────────
  - type: entities
    title: Settings
    show_header_toggle: false
    entities:
      - entity: select.brink_flair_400_bypass_mode
        name: Bypass mode
      - entity: number.brink_flair_400_bypass_temp_from_home
        name: Bypass temp from home
      - entity: number.brink_flair_400_bypass_temp_from_outside
        name: Bypass temp from outside
      - entity: number.brink_flair_400_bypass_hysteresis
        name: Bypass hysteresis
      - entity: number.brink_flair_400_flow_holiday
        name: Flow — Holiday
      - entity: number.brink_flair_400_flow_low
        name: Flow — Low
      - entity: number.brink_flair_400_flow_normal
        name: Flow — Normal
      - entity: number.brink_flair_400_flow_high
        name: Flow — High
      - entity: number.brink_flair_400_frost_control_temperature
        name: Frost control temperature
      - entity: number.brink_flair_400_frost_minimum_inlet_temperature
        name: Frost minimum inlet temperature
      - entity: number.brink_flair_400_days_before_filter_warning
        name: Days before filter warning
      - entity: number.brink_flair_400_supply_imbalance_offset
        name: Supply imbalance offset
      - entity: number.brink_flair_400_exhaust_imbalance_offset
        name: Exhaust imbalance offset
      - entity: number.brink_flair_400_bypass_boost_position
        name: Bypass boost position
      - entity: switch.brink_flair_400_bypass_boost
        name: Bypass boost
      - entity: switch.brink_flair_400_standby
        name: Standby
      - entity: button.brink_flair_400_filter_reset
        name: Filter reset
      - entity: button.brink_flair_400_appliance_reset
        name: Appliance reset
